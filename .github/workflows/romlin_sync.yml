name: Romlin upstream sync

# Merges upstream FAKE-08 into the romlin branch each week. The push starts the core
# release, which publishes only if the core builds.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: romlin-sync
  cancel-in-progress: false

jobs:
  merge:
    name: Merge upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for the sync token
        env:
          SYNC_TOKEN: ${{ secrets.ROMLIN_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::ROMLIN_SYNC_TOKEN is not set. Upstream changes workflow files, which the built-in token may not push."
            exit 1
          fi

      # Upstream changes files under .github/workflows, which only a token with the
      # workflows permission may push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # zizmor: ignore[artipacked] v4, credentials used only for git push
        with:
          ref: romlin
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.ROMLIN_SYNC_TOKEN }}

      - name: Merge upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/jtothebell/fake-08.git master
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream"
            exit 0
          fi
          git merge --no-edit FETCH_HEAD -m "Merge upstream FAKE-08"
          git submodule update --init --recursive
          git push origin HEAD:romlin
