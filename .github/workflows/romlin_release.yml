name: Romlin core release

# Builds the FAKE-08 libretro core that Romlin downloads for PICO-8 games, for
# macOS arm64, Linux x86_64 and Windows x86_64, and publishes it as a release
# named after the commit it was built from.

on:
  push:
    branches: [romlin]
  pull_request:
    branches: [romlin]
  workflow_dispatch:

permissions: {}

concurrency:
  group: romlin-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  macos:
    name: macOS arm64 core
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build
        run: make -C platform/libretro -j"$(sysctl -n hw.ncpu)" platform=osx
      - name: Package
        run: cd platform/libretro && zip -9 fake08_libretro-macos-arm64.zip fake08_libretro.dylib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-macos
          path: platform/libretro/fake08_libretro-macos-arm64.zip

  linux:
    name: Linux x86_64 core
    # The oldest Ubuntu Romlin supports, so the core loads there and on everything newer.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build
        run: make -C platform/libretro -j"$(nproc)" platform=unix
      - name: Package
        run: cd platform/libretro && zip -9 fake08_libretro-linux-x86_64.zip fake08_libretro.so
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-linux
          path: platform/libretro/fake08_libretro-linux-x86_64.zip

  windows:
    name: Windows x86_64 core
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: git make zip mingw-w64-ucrt-x86_64-gcc
      # -static also takes in winpthread, which MinGW otherwise leaves as a DLL that Windows lacks.
      - name: Build
        run: LDFLAGS=-static make -C platform/libretro -j"$(nproc)" platform=win
      - name: Check the core needs only Windows' own DLLs
        run: |
          imports=$(objdump -p platform/libretro/fake08_libretro.dll | sed -n 's/^\s*DLL Name: //p')
          echo "$imports"
          if echo "$imports" | grep -viE '^(kernel32|user32|msvcrt|ws2_32|advapi32|api-ms-win-.*)\.dll$'; then
            echo "::error::The core needs a DLL Windows doesn't ship"
            exit 1
          fi
      - name: Package
        run: cd platform/libretro && zip -9 fake08_libretro-windows-x86_64.zip fake08_libretro.dll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-windows
          path: platform/libretro/fake08_libretro-windows-x86_64.zip

  publish:
    name: Publish release
    needs: [tests, macos, linux, windows]
    if: >-
      github.repository == 'romlin-emu/fake-08' &&
      github.ref == 'refs/heads/romlin' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: core-*
          path: dl
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="core-$(date -u +%Y%m%d)-${GITHUB_SHA::10}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          cd dl
          for asset in *.zip; do sha256sum "$asset" > "$asset.sha256"; done
          gh release create "$tag" ./*.zip ./*.sha256 \
            --target "$GITHUB_SHA" \
            --title "FAKE-08 libretro core, ${GITHUB_SHA::10}" \
            --notes "The FAKE-08 PICO-8 libretro core for macOS arm64, Linux x86_64 and Windows x86_64, built from ${GITHUB_SHA::10} on the romlin branch." \
            --latest
