[tools]
hk = "2.12.0"
actionlint = "1.7.12"

[tasks.test]
description = "Build and run the unit tests (needs a C++17 compiler and initialized libs/z8lua)"
run = "make tests"

[tasks.check]
description = "Run hk checks on the whole tree"
run = "hk check --all"

[tasks.fix]
description = "Run hk fixers"
run = "hk fix"
